# LOYO screening (.claude/plans/loyo_conv.md): as ref.yaml + ERA5-Land soil water (3 layers, 0-100 cm, and anomalies of layer 1 and 0-100 cm
# against 1995-2015), fused late through a small GRU branch with modality dropout.
name: loyo_e5_sw
seed: 42

inputs:
  features: [s2, indices, observed, crop, country, era5land]
  grid: 10d

target:
  standardize_by: [crop, country]    # z-score yield per group (train stats)

splits: [europe/loyo/all, south_america/loyo/all]

model:
  type: convlstm          # LSTM gates = 3 x 3 convolutions over the 5 x 5 neighbourhood
  patch_size: 5
  hidden_channels: 32
  num_layers: 1
  kernel_size: 3
  head_size: 128
  dropout: 0.2
  late_features: [e5_swvl1, e5_swvl2, e5_swvl3, e5_swvl_rz, e5_swvl1_anom, e5_swvl_rz_anom]   # per-field series, fused late: small GRU -> head
  late_hidden: 16
  late_dropout: 0.3       # modality dropout: branch off for 30 % of the training samples

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 1024
  pixels_per_field: 500
  max_epochs: 100
  patience: 10             # on field-balanced val MSE (t/ha)
  eval_batch_size: 4096
  gpu_data_max_gb: 2.0
  augment: {time_shift: 3, step_dropout: 0.1}   # 3 steps = 30 days

ensemble:
  n_members: 2

wandb:
  project: yieldsat
  entity: null
  mode: disabled
