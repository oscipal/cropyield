# ConvLSTM: the LSTM gates are 3 x 3 convolutions over the pixel's 5 x 5 neighbourhood (scripts/LSTM/convlstm.py),
# otherwise as configs/lstm_patch_v3_s2.yaml (inputs, target, training, 5 members). Data: the 10-day S2 cube
# (scripts/LSTM/11_build_s2_grid.py --window-days 10), time shift 3 steps (= 30 days); chosen in the val screening,
# see docs/convlstm_screening.md.
# Pooled all-crop splits only. scripts/LSTM/04_train_v2.py; needs scripts/LSTM/06_neighbours.py --k 5.
name: convlstm_s2
data_dir: data_w10           # folder under <work_dir>/lstm, 51 steps of 10 days
paper_inputs: s2         # paper rows to compare with in 03_report.py
seed: 42

inputs:
  dynamic: [s2]
  static: []
  indices: [ndvi, ndre, ndmi]        # from raw bands, before z-scoring
  mask_channel: true                 # 1 = observed time step, 0 = missing
  categorical: [crop, country]       # one-hot, appended to the static inputs
  fill_value: 0.0

target:
  standardize_by: [crop, country]    # z-score yield per group (train stats); [] = off

splits: [europe/loyo/all, europe/loro/all, south_america/loyo/all, south_america/loro/all,
         world/loyo/all, world/loro/all]

model:
  type: convlstm          # lstm = pixel only (v2), patch = pixel + neighbourhood, convlstm = ConvLSTM on the patch
  patch_size: 5           # k x k window, 10 m pixels -> 50 m
  hidden_channels: 32
  num_layers: 1
  kernel_size: 3
  head_size: 128
  dropout: 0.2

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 1024
  pixels_per_field: 500    # pixels sampled per field and epoch; null = all pixels
  max_epochs: 100          # epochs are short with field sampling
  patience: 10             # on field-balanced val MSE (t/ha)
  eval_batch_size: 4096
  gpu_data_max_gb: 2.0     # small: the GPU may be shared with other runs
  augment: {time_shift: 3, step_dropout: 0.1}

ensemble:
  n_members: 5             # Deep Ensemble; 1 = single model

wandb:
  project: yieldsat
  entity: null
  mode: online
