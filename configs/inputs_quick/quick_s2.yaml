# Quick input test with the new loader (src/loader.py), control: S2 only. Small pixel LSTM, 2 members, 10-day grid,
# six pooled splits. Pair with quick_all.yaml (+ weather, soil, terrain); docs/inputs_quick_screening.md.
name: quick_s2
seed: 42

inputs:
  features: [s2, indices, observed, crop, country]
  grid: 10d

target:
  standardize_by: [crop, country]

splits: [europe/loyo/all, europe/loro/all, south_america/loyo/all, south_america/loro/all, world/loyo/all,
         world/loro/all]

model:
  type: lstm               # pixel LSTM (LSTM v2), small for speed
  hidden_size: 64
  num_layers: 1
  head_size: 64
  dropout: 0.2

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 1024
  pixels_per_field: 500
  max_epochs: 40
  patience: 6              # on field-balanced val MSE (t/ha)
  eval_batch_size: 8192
  gpu_data_max_gb: 2.0
  augment: {time_shift: 3, step_dropout: 0.1}   # 3 steps = 30 days

ensemble:
  n_members: 2

wandb:
  project: yieldsat
  entity: null
  mode: disabled
