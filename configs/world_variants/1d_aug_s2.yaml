# wv_1d_aug with other seeds (seed 7 instead of 42): measures the run-to-run noise (user, 2026-10-30).
# World variants: as base.yaml, but a 1-D model: the pixel's own series only (LSTM, no neighbourhood).
name: wv_1d_aug_s2
seed: 7      # seed repeat of wv_1d_aug: run-to-run noise

inputs:
  features: [s2, indices, observed, crop, country]
  grid: 30d

target:
  standardize_by: [crop, country]    # z-score yield per group (train stats)

splits: [world/loyo/all]

model:
  type: lstm              # pixel only: LSTM over the pixel's own series, no neighbourhood
  hidden_size: 32         # = hidden_channels of the base ConvLSTM
  num_layers: 1
  head_size: 128
  dropout: 0.2

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 1024
  pixels_per_field: 500
  max_epochs: 100
  patience: 10             # on field-balanced val MSE (t/ha)
  eval_batch_size: 4096
  gpu_data_max_gb: 2.0
  augment: {time_shift: 1, step_dropout: 0.1}   # as convlstm_base / wv_base_aug: ±1 step shift, 10 % step dropout

ensemble:
  n_members: 5

wandb:
  project: yieldsat
  entity: null
  mode: disabled
