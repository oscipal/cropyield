# wv_base_aug with other seeds (seed 7 instead of 42): run-to-run noise of the ConvLSTM (user, 2026-10-30).
# World variants (.claude/plans/world_variants.md): the base model. convlstm_base (configs/convlstm_screen/
# convlstm_base.yaml) on the new loader: S2 bands + NDVI/NDRE/NDMI + observed flag + crop + country, 30-day grid
# (days 210-720, 17 steps), ConvLSTM on the 5 x 5 patch. World LOYO only, 5 members. Every variant changes one thing.
name: wv_base_aug_s2
seed: 7      # seed repeat of wv_base_aug

inputs:
  features: [s2, indices, observed, crop, country]
  grid: 30d

target:
  standardize_by: [crop, country]    # z-score yield per group (train stats)

splits: [world/loyo/all]

model:
  type: convlstm          # LSTM gates = 3 x 3 convolutions over the 5 x 5 neighbourhood
  patch_size: 5
  hidden_channels: 32
  num_layers: 1
  kernel_size: 3
  head_size: 128
  dropout: 0.2

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 1024
  pixels_per_field: 500
  max_epochs: 100
  patience: 10             # on field-balanced val MSE (t/ha)
  eval_batch_size: 4096
  gpu_data_max_gb: 2.0
  augment: {time_shift: 1, step_dropout: 0.1}   # as convlstm_base: ±1 step shift, 10 % step dropout

ensemble:
  n_members: 5

wandb:
  project: yieldsat
  entity: null
  mode: disabled
