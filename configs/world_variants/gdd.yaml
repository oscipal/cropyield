# World variants: as base.yaml, but on a thermal-time axis: 17 windows of equal growing degree days (GDD) from a
# fixed start day per hemisphere x crop, best scene per window (scripts/LSTM/20_build_gdd_grid.py).
name: wv_gdd
seed: 42

inputs:
  features: [s2, indices, observed, crop, country]
  grid: gdd               # lstm/data_gdd

target:
  standardize_by: [crop, country]    # z-score yield per group (train stats)

splits: [world/loyo/all]

model:
  type: convlstm          # LSTM gates = 3 x 3 convolutions over the 5 x 5 neighbourhood
  patch_size: 5
  hidden_channels: 32
  num_layers: 1
  kernel_size: 3
  head_size: 128
  dropout: 0.2

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 1024
  pixels_per_field: 500
  max_epochs: 100
  patience: 10             # on field-balanced val MSE (t/ha)
  eval_batch_size: 4096
  gpu_data_max_gb: 2.0
  augment: {}              # no augmentation (user, 2026-10-28)

ensemble:
  n_members: 5

wandb:
  project: yieldsat
  entity: null
  mode: disabled
