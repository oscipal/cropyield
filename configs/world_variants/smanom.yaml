# World variants: as base.yaml + daily soil-moisture anomalies (ERA5-Land layer 1 and 0-100 cm root zone minus the
# cell's 1995-2015 climatology of the same calendar day), separate GRU branch fused late.
name: wv_smanom
seed: 42

inputs:
  features: [s2, indices, observed, crop, country]
  grid: 30d

target:
  standardize_by: [crop, country]    # z-score yield per group (train stats)

splits: [world/loyo/all]

model:
  type: convlstm          # LSTM gates = 3 x 3 convolutions over the 5 x 5 neighbourhood
  patch_size: 5
  hidden_channels: 32
  num_layers: 1
  kernel_size: 3
  head_size: 128
  dropout: 0.2
  daily_features: [swvl1_anom, swvl_rz_anom]   # per field and day, m3 m-3 vs 1995-2015
  late_hidden: 16         # GRU units of the daily branch
  late_dropout: 0.3       # modality dropout: branch off for 30 % of the training samples

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 1024
  pixels_per_field: 500
  max_epochs: 100
  patience: 10             # on field-balanced val MSE (t/ha)
  eval_batch_size: 4096
  gpu_data_max_gb: 2.0
  augment: {}              # no augmentation (user, 2026-10-28)

ensemble:
  n_members: 5

wandb:
  project: yieldsat
  entity: null
  mode: disabled
