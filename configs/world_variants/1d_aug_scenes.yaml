# wv_1d_aug on all S2 scenes, no windows (as wv_scenes) (user, 2026-10-30).
# World variants: as base.yaml, but a 1-D model: the pixel's own series only (LSTM, no neighbourhood).
name: wv_1d_aug_scenes
seed: 42

inputs:
  features: [s2, indices, observed, crop, country]
  scenes: true             # dynamic input = all usable S2 scenes (src/scenes.py); features give the static inputs

target:
  standardize_by: [crop, country]    # z-score yield per group (train stats)

splits: [world/loyo/all]

model:
  type: lstm              # pixel only: LSTM over the pixel's own series, no neighbourhood
  hidden_size: 32         # = hidden_channels of the base ConvLSTM
  num_layers: 1
  head_size: 128
  dropout: 0.2

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 1024
  pixels_per_field: 500
  max_epochs: 100
  patience: 10             # on field-balanced val MSE (t/ha)
  eval_batch_size: 4096
  gpu_data_max_gb: 2.0
  augment: {day_shift: 30, step_dropout: 0.1}   # scene version of wv_base_aug: ±30 days on the day channel, 10 % of the scenes dropped
  bucket_by_length: true   # batches of similar sequence length (less padding)

ensemble:
  n_members: 5

wandb:
  project: yieldsat
  entity: null
  mode: disabled
